<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<title>ສັ່ງຊື້ 玉灵膏</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--red:#b3261e;--red2:#8e1c16;--cream:#f6efe6;--ink:#2b211c;--mute:#7a6b62;--line:#e6dacd}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Noto Sans Lao',sans-serif;background:var(--cream);color:var(--ink)}
  header{background:var(--red);color:#fff;padding:22px 18px 18px;text-align:center}
  header h1{margin:0;font-size:22px}
  header p{margin:4px 0 0;opacity:.85;font-size:14px}
  main{max-width:560px;margin:0 auto;padding:14px 14px 120px}
  h2{font-size:17px;margin:22px 0 10px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
  .card img{width:76px;height:76px;object-fit:cover;border-radius:10px;background:var(--cream);flex:none}
  .card .ph{width:76px;height:76px;border-radius:10px;background:#f1e3d6;flex:none;display:grid;place-items:center;color:var(--red);font-size:26px}
  .card .info{flex:1;min-width:0}
  .card .nm{font-weight:600;line-height:1.35}
  .card .ds{font-size:13px;color:var(--mute);margin-top:2px}
  .card .pr{color:var(--red);font-weight:700;margin-top:4px}
  .qty{display:flex;align-items:center;gap:8px;flex:none}
  .qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--red);background:#fff;color:var(--red);font-size:20px;line-height:1;cursor:pointer}
  .qty button.plus{background:var(--red);color:#fff}
  .qty span{min-width:18px;text-align:center;font-weight:700}
  .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
  label{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
  label:first-child{margin-top:0}
  input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:#fffdfb}
  textarea{min-height:64px;resize:vertical}
  .pay{font-size:15px;line-height:1.7}
  .pay b{font-size:17px}
  .qr{text-align:center;margin-bottom:12px;font-size:13px;color:var(--mute)}
  .qr img{display:block;width:100%;max-width:280px;aspect-ratio:1;object-fit:contain;margin:0 auto 6px;border-radius:12px;border:1px solid var(--line);background:#fff}
  .br{display:flex;gap:12px;align-items:flex-start;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;margin:0 0 8px;cursor:pointer;font-weight:400}
  .br.on{border-color:var(--red);background:#fff8f6}
  .br .dot{width:20px;height:20px;border-radius:50%;border:2px solid #cbb8a6;flex:none;margin-top:2px}
  .br.on .dot{border:6px solid var(--red)}
  .br small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
  .br a{display:inline-block;margin-top:4px;color:var(--red);font-size:13px}
  .copy{border:1px solid var(--red);color:var(--red);background:#fff;border-radius:8px;padding:2px 10px;font:inherit;font-size:13px;margin-left:6px;cursor:pointer}
  .slip{border:2px dashed #d6c2ad;background:#fbf6f0;border-radius:14px;min-height:180px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--mute);cursor:pointer}
  .slip .plus{font-size:40px;color:var(--red);line-height:1;margin-bottom:6px}
  .slip img{max-width:100%;max-height:320px;border-radius:8px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
  .bar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .bar .tt{flex:1}
  .bar .tt small{color:var(--mute);display:block;font-size:12px}
  .bar .tt b{font-size:20px;color:var(--red)}
  .btn{background:var(--red);color:#fff;border:0;border-radius:12px;padding:14px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
  .btn:disabled{opacity:.45}
  .err{color:var(--red);font-size:14px;margin-top:8px;min-height:1em}
  .center{text-align:center;padding:50px 10px;color:var(--mute)}
  .done{text-align:center;padding:40px 16px}
  .done .ok{width:72px;height:72px;border-radius:50%;background:#2e7d32;color:#fff;font-size:40px;display:grid;place-items:center;margin:0 auto 14px}
  .done .id{font-size:24px;font-weight:700;color:var(--red);letter-spacing:1px;margin:8px 0}
</style>
</head>
<body>
<header><h1 id="shopName">…</h1><p>ສັ່ງຊື້ອອນລາຍ · ໂອນເງິນ · ແນບສະລິບ</p></header>
<main id="app"><div class="center">ກຳລັງໂຫຼດ…</div></main>
<div class="bar" id="bar" style="display:none"><div class="in">
  <div class="tt"><small>ລວມທັງໝົດ</small><b id="total">0</b></div>
  <button class="btn" id="submit">ສົ່ງອໍເດີ</button>
</div></div>

<script>
async function api(path, data){
  const r = await fetch(path, data ? { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) } : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'ຜິດພາດ');
  return j;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toLocaleString('en-US');
let MENU = [], S = {}, BR = [], cart = {}, slip = null, branchId = '';

function cur(n){ return fmt(n) + ' ' + (S.currency || ''); }

async function init(){
  try {
    const d = await api('/beautishop/api/config');
    MENU = d.menu; S = d.settings; BR = d.branches || [];
    if (BR.length === 1) branchId = BR[0].id;
    document.title = S.shopName || document.title;
    document.getElementById('shopName').textContent = S.shopName || 'ສັ່ງຊື້';
    render();
  } catch(e){ document.getElementById('app').innerHTML = '<div class="center">ໂຫຼດບໍ່ໄດ້ ລອງໃໝ່ອີກຄັ້ງ</div>'; }
}

function render(){
  const app = document.getElementById('app');
  if (!MENU.length){ app.innerHTML = '<div class="center">ຍັງບໍ່ມີສິນຄ້າ</div>'; return; }
  let step = 0; const n = () => ++step;
  app.innerHTML = `
    <h2>${n()}. ເລືອກສິນຄ້າ</h2>
    ${MENU.map(m => `
      <div class="card">
        ${m.image ? `<img src="${esc(m.image)}" alt="">` : `<div class="ph">膏</div>`}
        <div class="info"><div class="nm">${esc(m.name)}</div>
          ${m.desc ? `<div class="ds">${esc(m.desc)}</div>` : ''}
          <div class="pr">${esc(cur(m.price))}</div></div>
        <div class="qty"><button data-id="${esc(m.id)}" data-d="-1">−</button><span id="q-${esc(m.id)}">0</span><button class="plus" data-id="${esc(m.id)}" data-d="1">+</button></div>
      </div>`).join('')}

    ${BR.length ? `<h2>${n()}. ເລືອກສາຂາທີ່ຈະໄປຮັບສິນຄ້າ *</h2>
    ${BR.map(b => `<label class="br ${b.id===branchId?'on':''}" data-b="${esc(b.id)}">
        <span class="dot"></span>
        <span style="flex:1"><b>${esc(b.name)}</b>${b.detail ? `<small>${esc(b.detail)}</small>` : ''}
        ${b.map ? `<a href="${esc(b.map)}" target="_blank" rel="noopener">📍 ເບິ່ງແຜນທີ່</a>` : ''}</span></label>`).join('')}` : ''}

    <h2>${n()}. ຂໍ້ມູນຜູ້ສັ່ງ</h2>
    <div class="box">
      <label>ຊື່ *</label><input id="name" autocomplete="name" maxlength="100">
      <label>ເບີໂທ / WhatsApp *</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="30" placeholder="020 xxxx xxxx">
      <label>ໝາຍເຫດ / ທີ່ຢູ່ຈັດສົ່ງ</label><textarea id="note" maxlength="500"></textarea>
    </div>

    <h2>${n()}. ສະແກນ QR ຈ່າຍເງິນ</h2>
    <div class="box pay">
      ${S.qrImage ? `<div class="qr"><img src="${esc(S.qrImage)}" alt="QR"><div>ກົດຄ້າງທີ່ຮູບເພື່ອບັນທຶກ ແລ້ວສະແກນໃນແອັບທະນາຄານ</div></div>` : ''}
      ${S.bankName ? `ທະນາຄານ: <b>${esc(S.bankName)}</b><br>` : ''}
      ${S.bankAccount ? `ເລກບັນຊີ: <b id="acc">${esc(S.bankAccount)}</b><button class="copy" id="copy">ສຳເນົາ</button><br>` : ''}
      ${S.accountName ? `ຊື່ບັນຊີ: <b>${esc(S.accountName)}</b><br>` : ''}
      ຍອດໂອນ: <b id="payAmt" style="color:var(--red)">0</b>
      ${S.contact ? `<div style="margin-top:8px;font-size:14px;color:var(--mute)">ຕິດຕໍ່: ${esc(S.contact)}</div>` : ''}
    </div>

    <h2>${n()}. ແນບສະລິບໂອນເງິນ *</h2>
    <div class="slip" id="slipBox"><span class="plus">+</span>ແຕະເພື່ອໃສ່ຮູບສະລິບ</div>
    <input type="file" id="slipFile" accept="image/*" hidden>
    <div class="err" id="err"></div>`;

  app.querySelectorAll('.qty button').forEach(b => b.onclick = () => {
    const id = b.dataset.id; cart[id] = Math.max(0, Math.min(99, (cart[id] || 0) + Number(b.dataset.d)));
    document.getElementById('q-' + id).textContent = cart[id]; updateTotal();
  });
  app.querySelectorAll('.br').forEach(el => el.onclick = e => {
    if (e.target.tagName === 'A') return;
    branchId = el.dataset.b; app.querySelectorAll('.br').forEach(x => x.classList.toggle('on', x === el));
  });
  document.getElementById('slipBox').onclick = () => document.getElementById('slipFile').click();
  document.getElementById('slipFile').onchange = onSlip;
  const cp = document.getElementById('copy');
  if (cp) cp.onclick = () => { navigator.clipboard?.writeText(S.bankAccount); cp.textContent = 'ສຳເນົາແລ້ວ ✓'; };
  document.getElementById('bar').style.display = '';
  updateTotal();
}

function total(){ return MENU.reduce((t, m) => t + m.price * (cart[m.id] || 0), 0); }
function updateTotal(){
  const t = cur(total());
  document.getElementById('total').textContent = t;
  const p = document.getElementById('payAmt'); if (p) p.textContent = t;
}

function onSlip(e){
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    const max = 1400, k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const durl = c.toDataURL('image/jpeg', 0.82);
    slip = { mime: 'image/jpeg', data: durl.split(',')[1] };
    document.getElementById('slipBox').innerHTML = `<img src="${durl}"><div style="margin-top:6px;font-size:13px">ກົດເພື່ອປ່ຽນຮູບ</div>`;
    URL.revokeObjectURL(url);
  };
  img.onerror = () => { document.getElementById('err').textContent = 'ອ່ານຮູບບໍ່ໄດ້ ລອງຮູບອື່ນ'; };
  img.src = url;
}

document.getElementById('submit').onclick = async () => {
  const err = document.getElementById('err'); err.textContent = '';
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const note = document.getElementById('note').value.trim();
  const items = Object.entries(cart).filter(([, q]) => q > 0).map(([id, qty]) => ({ id, qty }));
  let msg = '';
  if (!items.length) msg = 'ກະລຸນາເລືອກສິນຄ້າ';
  else if (BR.length && !branchId) msg = 'ກະລຸນາເລືອກສາຂາຮັບສິນຄ້າ';
  else if (!name) msg = 'ກະລຸນາໃສ່ຊື່';
  else if (phone.replace(/\D/g, '').length < 8) msg = 'ກະລຸນາໃສ່ເບີໂທໃຫ້ຖືກຕ້ອງ';
  else if (!slip) msg = 'ກະລຸນາແນບສະລິບໂອນເງິນ';
  if (msg){ err.textContent = msg; err.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }

  const btn = document.getElementById('submit'); btn.disabled = true; btn.textContent = 'ກຳລັງສົ່ງ…';
  try {
    const r = await api('/beautishop/api/order', { name, phone, note, items, slip, branchId });
    document.getElementById('bar').style.display = 'none';
    document.getElementById('app').innerHTML = `
      <div class="done"><div class="ok">✓</div>
        <h2>ສັ່ງຊື້ສຳເລັດ ຂອບໃຈຫຼາຍໆ</h2>
        <div>ເລກອໍເດີ</div><div class="id">${esc(r.orderId)}</div>
        <div>ຍອດ ${esc(cur(r.total))}</div>
        ${branchId ? `<div style="margin-top:6px">ຮັບສິນຄ້າທີ່: <b>${esc((BR.find(b => b.id === branchId) || {}).name || '')}</b></div>` : ''}
        <p style="color:var(--mute)">ພວກເຮົາຈະກວດສະລິບ ແລະ ຕິດຕໍ່ກັບທາງເບີ ${esc(phone)}</p>
        <button class="btn" onclick="location.reload()">ສັ່ງເພີ່ມ</button></div>`;
    window.scrollTo(0, 0);
  } catch(e){
    err.textContent = (e.message || 'ສົ່ງບໍ່ສຳເລັດ') + ' — ລອງໃໝ່ອີກຄັ້ງ';
    btn.disabled = false; btn.textContent = 'ສົ່ງອໍເດີ';
  }
};

init();
</script>
</body>
</html>
