<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>หลังบ้าน 玉灵膏</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&family=Noto+Sans+Lao:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--red:#b3261e;--cream:#f6efe6;--ink:#2b211c;--mute:#7a6b62;--line:#e6dacd}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Noto Sans Thai','Noto Sans Lao',sans-serif;background:var(--cream);color:var(--ink)}
  header{background:var(--red);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
  header h1{margin:0;font-size:18px;flex:1}
  nav{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  nav button{flex:1;padding:13px 4px;border:0;background:none;font:inherit;font-weight:600;font-size:14px;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer}
  nav button.on{color:var(--red);border-color:var(--red)}
  main{max-width:720px;margin:0 auto;padding:14px 14px 90px}
  .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .box h3{margin:0 0 4px;font-size:16px}
  label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:var(--mute)}
  input,textarea,select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:16px;background:#fffdfb}
  textarea{min-height:54px}
  .row{display:flex;gap:8px;align-items:center}
  .btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--red);border:1px solid var(--red)}
  .btn.sm{padding:6px 12px;font-size:14px}
  .btn:disabled{opacity:.5}
  .center{text-align:center;padding:40px 10px;color:var(--mute)}
  .ord .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .ord .id{font-weight:700;color:var(--red)}
  .ord .tm{font-size:12px;color:var(--mute)}
  .ord .it{margin:8px 0;font-size:15px}
  .ord .br{display:inline-block;background:#fff4e0;color:#8a5a00;border-radius:8px;padding:3px 9px;font-size:13px;margin-top:6px}
  .ord .tot{font-weight:700}
  .ord a{color:var(--red)}
  .tag{font-size:12px;padding:3px 9px;border-radius:20px;background:#eee;white-space:nowrap}
  .st0{background:#fde7e5;color:var(--red)} .st1{background:#e3f0ff;color:#1856a8} .st2{background:#e3f4e5;color:#2e7d32} .st3{background:#eee;color:#888}
  .filter{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
  .filter button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}
  .filter button.on{background:var(--red);color:#fff;border-color:var(--red)}
  /* กล่องสี่เหลี่ยมใส่รูป */
  .pic{position:relative;width:110px;height:110px;flex:none;border:2px dashed #d6c2ad;border-radius:12px;background:#fbf6f0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mute);font-size:12px;cursor:pointer;overflow:hidden;text-align:center;line-height:1.3}
  .pic .plus{font-size:30px;color:var(--red);line-height:1}
  .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .pic.has{border-style:solid;border-color:var(--line)}
  .pic .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:0;font-size:15px;line-height:1;cursor:pointer;z-index:2}
  .pic.big{width:220px;height:220px;margin:8px auto 0}
  .pic.busy::after{content:'กำลังอัปโหลด…';position:absolute;inset:0;background:rgba(255,255,255,.85);display:grid;place-items:center;color:var(--red);font-weight:600}
  .chk{display:flex;align-items:center;gap:6px;font-size:14px;margin:0}
  .chk input{width:auto}
  .savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;z-index:6}
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#2b211c;color:#fff;padding:10px 18px;border-radius:10px;z-index:40;font-size:14px;display:none}
  .hint{font-size:12px;color:var(--mute);margin-top:4px}
  .sum{display:flex;gap:8px;margin-bottom:10px}
  .sum div{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .sum b{display:block;font-size:18px;color:var(--red)}
  .sum small{color:var(--mute);font-size:12px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal .card{background:#fff;border-radius:14px;padding:18px;max-width:340px;width:100%}
  .modal .card p{margin:0 0 14px}
</style>
</head>
<body>
<header><h1>หลังบ้าน · ร้านสั่ง 玉灵膏</h1><button class="btn ghost sm" id="refresh" style="display:none">↻</button></header>
<div id="root"></div>
<div class="toast" id="toast"></div>
<input type="file" id="picFile" accept="image/*" hidden>

<script>
async function api(data){
  const r = await fetch('/beautishop/api/admin', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ pw: PW, ...data }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'ผิดพลาด');
  return j;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toLocaleString('en-US');
const STATUS_TH = {new:'ใหม่',confirmed:'ยืนยันแล้ว',shipped:'ส่งแล้ว',cancelled:'ยกเลิก'};
let PW = '', D = null, tab = 'orders', filter = 'all', brFilter = 'all', dirty = false;

function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = 'none', 2200); }
function cleanErr(e){ return String(e.message || e).replace(/^(Error|Exception):\s*/, ''); }
function ask(msg){
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="card"><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end">
      <button class="btn ghost sm" data-v="0">ไม่</button><button class="btn sm" data-v="1">ตกลง</button></div></div>`;
    m.onclick = e => { const v = e.target.dataset && e.target.dataset.v; if (v === undefined && e.target !== m) return; m.remove(); res(v === '1'); };
    document.body.appendChild(m);
  });
}

/* ---------- ล็อกอิน ---------- */
function loginView(msg){
  document.getElementById('root').innerHTML = `
    <main><div class="box" style="max-width:360px;margin:40px auto">
      <label>รหัสผ่านแอดมิน</label>
      <input id="pw" type="password" autocomplete="current-password">
      <div style="color:var(--red);font-size:14px;margin-top:6px">${esc(msg || '')}</div>
      <button class="btn" id="go" style="width:100%;margin-top:12px">เข้าสู่ระบบ</button>
    </div></main>`;
  const go = async () => { PW = document.getElementById('pw').value; if (!PW) return; document.getElementById('go').disabled = true; await load(true); };
  document.getElementById('go').onclick = go;
  document.getElementById('pw').onkeydown = e => { if (e.key === 'Enter') go(); };
  document.getElementById('pw').focus();
}

async function load(first){
  try {
    const r = await api({ action:'data' });
    D = { menu: r.config.menu, settings: r.config.settings, branches: r.config.branches || [], orders: r.orders, statuses: r.statuses };
    try { sessionStorage.setItem('ylpw', PW); } catch(e){}
    dirty = false;
    document.getElementById('refresh').style.display = '';
    shell();
  } catch(e){
    if (first) { try { sessionStorage.removeItem('ylpw'); } catch(_){} loginView(cleanErr(e)); } else toast(cleanErr(e));
  }
}

async function saveAll(){
  const r = await api({ action:'saveConfig', config:{ settings: D.settings, menu: D.menu, branches: D.branches } });
  D.settings = r.config.settings; D.menu = r.config.menu; D.branches = r.config.branches; dirty = false;
}

function shell(){
  document.getElementById('root').innerHTML = `
    <nav>
      <button data-t="orders">ออเดอร์</button>
      <button data-t="menu">เมนู</button>
      <button data-t="branches">สาขา</button>
      <button data-t="settings">QR / ตั้งค่า</button>
    </nav><main id="main"></main>`;
  document.querySelectorAll('nav button').forEach(b => b.onclick = async () => {
    if (b.dataset.t === tab) return;
    if (dirty) { if (!await ask('ยังไม่ได้บันทึก จะทิ้งที่แก้ไว้ไหม?')) return; dirty = false; await load(); }
    tab = b.dataset.t; draw();
  });
  draw();
}

function draw(){
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  ({ orders: drawOrders, menu: drawMenu, branches: drawBranches, settings: drawSettings })[tab]();
  window.scrollTo(0, 0);
}

/* ---------- กล่องรูป (ใช้ทั้งเมนูและ QR) ---------- */
let picCb = null;
function picBox(url, cls = ''){
  return `<div class="pic ${cls} ${url ? 'has' : ''}">${url
    ? `<img src="${esc(url)}" alt=""><button class="x" title="ลบรูป">×</button>`
    : `<span class="plus">+</span><span>แตะเพื่อ<br>ใส่รูป</span>`}</div>`;
}
function bindPic(el, onUrl){
  el.onclick = e => {
    if (e.target.classList.contains('x')) { e.stopPropagation(); onUrl(''); return; }
    picCb = async file => {
      el.classList.add('busy');
      try { const { data, mime } = await shrink(file, 1000); onUrl((await api({ action:'upload', data, mime })).url); }
      catch(err){ el.classList.remove('busy'); toast(cleanErr(err)); }
    };
    document.getElementById('picFile').click();
  };
}
document.getElementById('picFile').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f && picCb) picCb(f); };

/* ---------- ออเดอร์ ---------- */
function drawOrders(){
  const cur = D.settings.currency || '';
  const list = D.orders.filter(o => (filter === 'all' || o.status === filter) && (brFilter === 'all' || (o.branch || '') === brFilter));
  const dayKey = t => new Date(t).toLocaleDateString('en-GB', { timeZone:'Asia/Vientiane' });
  const tk = dayKey(Date.now());
  const todays = D.orders.filter(o => dayKey(o.ts) === tk && o.status !== 'cancelled');
  const pending = D.orders.filter(o => o.status === 'new').length;
  const brNames = [...new Set(D.orders.map(o => o.branch).filter(Boolean))];
  document.getElementById('main').innerHTML = `
    <div class="sum">
      <div><b>${pending}</b><small>รอตรวจสลิป</small></div>
      <div><b>${todays.length}</b><small>ออเดอร์วันนี้</small></div>
      <div><b>${fmt(todays.reduce((t,o)=>t+o.total,0))}</b><small>ยอดวันนี้ ${esc(cur)}</small></div>
    </div>
    <div class="filter">
      ${[['all','ทั้งหมด'], ...D.statuses.map(s => [s, STATUS_TH[s] || s])].map(([v,t]) =>
        `<button data-f="${esc(v)}" class="${filter===v?'on':''}">${esc(t)}</button>`).join('')}
    </div>
    ${brNames.length ? `<select id="brF" style="margin-bottom:10px">
        <option value="all">ทุกสาขา</option>
        ${brNames.map(n => `<option value="${esc(n)}" ${brFilter===n?'selected':''}>${esc(n)}</option>`).join('')}
      </select>` : ''}
    ${list.length ? list.map(o => {
      const si = D.statuses.indexOf(o.status);
      return `<div class="box ord">
        <div class="top"><div><div class="id">${esc(o.orderId)}</div><div class="tm">${esc(new Date(o.ts).toLocaleString('en-GB', { timeZone:'Asia/Vientiane', day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' }))}</div></div>
          <span class="tag st${si}">${esc(STATUS_TH[o.status] || o.status)}</span></div>
        <div style="margin-top:8px"><b>${esc(o.name)}</b> · <a href="tel:${esc(o.phone.replace(/\s/g,''))}">${esc(o.phone)}</a>
          · <a href="https://wa.me/${esc(o.phone.replace(/\D/g,'').replace(/^0/,'856'))}" target="_blank">WhatsApp</a></div>
        ${o.branch ? `<div class="br">📍 รับที่: ${esc(o.branch)}</div>` : ''}
        <div class="it">${o.items.map(i => esc(i.name) + ' × ' + i.qty).join('<br>')}</div>
        ${o.note ? `<div style="font-size:14px;color:var(--mute)">📝 ${esc(o.note)}</div>` : ''}
        <div class="row" style="margin-top:10px;justify-content:space-between">
          <span class="tot">${fmt(o.total)} ${esc(cur)}</span>
          ${o.slip ? `<a href="#" class="slipBtn" data-p="${esc(o.slip)}">🧾 ดูสลิป</a>` : ''}
        </div>
        <select data-id="${esc(o.orderId)}" style="margin-top:10px">
          ${D.statuses.map(s => `<option value="${esc(s)}" ${s===o.status?'selected':''}>${esc(STATUS_TH[s]||s)}</option>`).join('')}
        </select>
      </div>`; }).join('') : '<div class="center">ยังไม่มีออเดอร์</div>'}`;
  document.querySelectorAll('.filter button').forEach(b => b.onclick = () => { filter = b.dataset.f; drawOrders(); });
  const bf = document.getElementById('brF'); if (bf) bf.onchange = () => { brFilter = bf.value; drawOrders(); };
  document.querySelectorAll('.slipBtn').forEach(a => a.onclick = e => { e.preventDefault(); showSlip(a.dataset.p); });
  document.querySelectorAll('select[data-id]').forEach(s => s.onchange = async () => {
    s.disabled = true;
    try { await api({ action:'setStatus', orderId: s.dataset.id, status: s.value });
      D.orders.find(o => o.orderId == s.dataset.id).status = s.value; toast('อัปเดตแล้ว'); drawOrders();
    } catch(e){ toast(cleanErr(e)); s.disabled = false; }
  });
}

/* ---------- เมนู ---------- */
function drawMenu(){
  const cur = D.settings.currency || '';
  document.getElementById('main').innerHTML = `
    <div class="hint" style="margin-bottom:10px">แตะกล่องสี่เหลี่ยมเพื่อใส่รูป · เมนูที่ราคา 0 หรือปิดขาย ลูกค้าจะไม่เห็น · แก้เสร็จกด "บันทึกเมนู"</div>
    ${D.menu.map((m, i) => `
      <div class="box mi" data-i="${i}">
        <div class="row" style="align-items:flex-start;gap:12px">
          ${picBox(m.image)}
          <div style="flex:1;min-width:0">
            <label style="margin-top:0">ชื่อสินค้า</label><input data-k="name" value="${esc(m.name)}" placeholder="เช่น 玉灵膏 220g">
            <label>ราคา (${esc(cur)})</label><input data-k="price" type="number" inputmode="numeric" min="0" value="${m.price || ''}" placeholder="0">
          </div>
        </div>
        <label>รายละเอียด (ไม่บังคับ)</label><input data-k="desc" value="${esc(m.desc)}">
        <div class="row" style="margin-top:12px;justify-content:space-between">
          <label class="chk"><input type="checkbox" data-k="active" ${m.active?'checked':''}> เปิดขาย</label>
          <div class="row">
            <button class="btn ghost sm mv" data-d="-1">↑</button>
            <button class="btn ghost sm mv" data-d="1">↓</button>
            <button class="btn ghost sm del">ลบ</button>
          </div>
        </div>
      </div>`).join('')}
    <button class="btn ghost" id="add" style="width:100%">+ เพิ่มเมนู</button>
    <div class="savebar"><button class="btn" id="save" style="min-width:200px">บันทึกเมนู</button></div>`;

  const sync = () => document.querySelectorAll('.mi').forEach(el => {
    const m = D.menu[el.dataset.i];
    el.querySelectorAll('[data-k]').forEach(inp => { const k = inp.dataset.k;
      m[k] = k === 'active' ? inp.checked : k === 'price' ? Number(inp.value) || 0 : inp.value; });
  });
  document.querySelectorAll('.mi [data-k]').forEach(inp => inp.oninput = inp.onchange = () => { dirty = true; });
  document.querySelectorAll('.mi').forEach(el => bindPic(el.querySelector('.pic'), url => { sync(); D.menu[el.dataset.i].image = url; dirty = true; drawMenu(); if (url) toast('ใส่รูปแล้ว อย่าลืมกดบันทึก'); }));
  document.getElementById('add').onclick = () => { sync(); D.menu.push({ id:'', name:'', desc:'', price:0, image:'', active:true }); dirty = true; drawMenu(); window.scrollTo(0, document.body.scrollHeight); };
  document.querySelectorAll('.mi .del').forEach(b => b.onclick = async () => {
    if (!await ask('ลบเมนูนี้?')) return; sync(); D.menu.splice(b.closest('.mi').dataset.i, 1); dirty = true; drawMenu(); });
  document.querySelectorAll('.mi .mv').forEach(b => b.onclick = () => {
    sync(); const i = Number(b.closest('.mi').dataset.i), j = i + Number(b.dataset.d);
    if (j < 0 || j >= D.menu.length) return; [D.menu[i], D.menu[j]] = [D.menu[j], D.menu[i]]; dirty = true; drawMenu(); });
  document.getElementById('save').onclick = async () => {
    sync(); const b = document.getElementById('save'); b.disabled = true; b.textContent = 'กำลังบันทึก…';
    try { await saveAll(); drawMenu(); toast('บันทึกเมนูแล้ว ✓'); }
    catch(e){ toast(cleanErr(e)); b.disabled = false; b.textContent = 'บันทึกเมนู'; }
  };
}

/* ---------- สาขา ---------- */
function drawBranches(){
  document.getElementById('main').innerHTML = `
    <div class="hint" style="margin-bottom:10px">สาขาที่ลูกค้าเลือกไปรับสินค้า · ถ้าไม่มีสาขาเลย หน้าลูกค้าจะไม่ถามสาขา</div>
    ${D.branches.map((b, i) => `
      <div class="box bi" data-i="${i}">
        <label style="margin-top:0">ชื่อสาขา</label><input data-k="name" value="${esc(b.name)}" placeholder="เช่น ສາຂາສີເມືອງ">
        <label>ที่อยู่ / เวลารับของ (ไม่บังคับ)</label><input data-k="detail" value="${esc(b.detail)}" placeholder="เช่น ໃກ້ຕະຫຼາດ... ເປີດ 8:00-18:00">
        <label>ลิงก์ Google Maps (ไม่บังคับ)</label><input data-k="map" value="${esc(b.map)}" placeholder="https://maps.app.goo.gl/...">
        <div class="row" style="margin-top:12px;justify-content:space-between">
          <label class="chk"><input type="checkbox" data-k="active" ${b.active?'checked':''}> เปิดให้เลือก</label>
          <button class="btn ghost sm del">ลบ</button>
        </div>
      </div>`).join('')}
    <button class="btn ghost" id="add" style="width:100%">+ เพิ่มสาขา</button>
    <div class="savebar"><button class="btn" id="save" style="min-width:200px">บันทึกสาขา</button></div>`;
  const sync = () => document.querySelectorAll('.bi').forEach(el => {
    const b = D.branches[el.dataset.i];
    el.querySelectorAll('[data-k]').forEach(inp => { b[inp.dataset.k] = inp.dataset.k === 'active' ? inp.checked : inp.value; });
  });
  document.querySelectorAll('.bi [data-k]').forEach(inp => inp.oninput = inp.onchange = () => { dirty = true; });
  document.getElementById('add').onclick = () => { sync(); D.branches.push({ id:'', name:'', detail:'', map:'', active:true }); dirty = true; drawBranches(); window.scrollTo(0, document.body.scrollHeight); };
  document.querySelectorAll('.bi .del').forEach(b => b.onclick = async () => {
    if (!await ask('ลบสาขานี้?')) return; sync(); D.branches.splice(b.closest('.bi').dataset.i, 1); dirty = true; drawBranches(); });
  document.getElementById('save').onclick = async () => {
    sync(); const b = document.getElementById('save'); b.disabled = true; b.textContent = 'กำลังบันทึก…';
    try { await saveAll(); drawBranches(); toast('บันทึกสาขาแล้ว ✓'); }
    catch(e){ toast(cleanErr(e)); b.disabled = false; b.textContent = 'บันทึกสาขา'; }
  };
}

/* ---------- QR / ตั้งค่า ---------- */
function drawSettings(){
  const s = D.settings;
  const f = (k, t, h) => `<label>${t}</label><input data-s="${k}" value="${esc(s[k] || '')}">${h ? `<div class="hint">${h}</div>` : ''}`;
  document.getElementById('main').innerHTML = `
    <div class="box" style="text-align:center">
      <h3>QR รับเงินของคุณ</h3>
      <div class="hint">แตะกล่องเพื่อใส่รูป QR (แคปจากแอปธนาคาร) ลูกค้าจะสแกนจ่ายจากรูปนี้</div>
      <div id="qrWrap">${picBox(s.qrImage, 'big')}</div>
    </div>
    <div class="box">
      ${f('bankName','ธนาคาร')}
      ${f('bankAccount','เลขบัญชี')}
      ${f('accountName','ชื่อบัญชี')}
    </div>
    <div class="box">
      ${f('shopName','ชื่อร้าน (โชว์หัวเว็บ)')}
      ${f('currency','สกุลเงิน','เช่น ₭ หรือ บาท')}
      ${f('contact','ช่องทางติดต่อ (โชว์ให้ลูกค้า)','เช่น WhatsApp 020 xxxx xxxx')}
    </div>
    <div class="savebar"><button class="btn" id="save" style="min-width:200px">บันทึกตั้งค่า</button></div>`;
  const syncS = () => document.querySelectorAll('[data-s]').forEach(i => D.settings[i.dataset.s] = i.value.trim());
  document.querySelectorAll('[data-s]').forEach(i => i.oninput = () => { dirty = true; });
  bindPic(document.querySelector('#qrWrap .pic'), async url => {
    syncS(); D.settings.qrImage = url;
    try { await saveAll(); drawSettings(); toast(url ? 'บันทึก QR แล้ว ✓' : 'ลบ QR แล้ว'); } catch(e){ toast(cleanErr(e)); drawSettings(); }
  });
  document.getElementById('save').onclick = async () => {
    const b = document.getElementById('save'); b.disabled = true; syncS();
    try { await saveAll(); drawSettings(); toast('บันทึกแล้ว ✓'); }
    catch(e){ toast(cleanErr(e)); b.disabled = false; }
  };
}

function shrink(file, max){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res({ mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.88).split(',')[1] });
    };
    img.onerror = () => rej(new Error('อ่านรูปไม่ได้'));
    img.src = url;
  });
}

async function showSlip(p){
  toast('กำลังโหลดสลิป…');
  try {
    const r = await fetch('/beautishop/api/slip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ pw: PW, p }) });
    if (!r.ok) throw new Error('โหลดสลิปไม่ได้');
    const url = URL.createObjectURL(await r.blob());
    const ov = document.createElement('div'); ov.className = 'modal'; ov.style.background = 'rgba(0,0,0,.88)';
    ov.innerHTML = `<img src="${url}" style="max-width:100%;max-height:100%;border-radius:8px">`;
    ov.onclick = () => { ov.remove(); URL.revokeObjectURL(url); };
    document.body.appendChild(ov);
  } catch(e){ toast(cleanErr(e)); }
}

document.getElementById('refresh').onclick = async () => { if (dirty && !await ask('ยังไม่ได้บันทึก จะโหลดใหม่ไหม?')) return; load(); toast('กำลังโหลด…'); };
window.onbeforeunload = () => dirty ? true : undefined;
try { const saved = sessionStorage.getItem('ylpw'); if (saved) { PW = saved; load(true); } else loginView(); } catch(e){ loginView(); }
</script>
